name: Validate and deliver local app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm run check
      - run: npm run validate-data
      - run: npm test
      - name: Package local release
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          tar -czf dist/dynasty-maker.tar.gz package.json README.md LICENSE src public examples
      - name: Deliver downloadable app
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dynasty-maker-local
          path: dist/dynasty-maker.tar.gz
          retention-days: 14
