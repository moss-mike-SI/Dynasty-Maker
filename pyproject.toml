[project]
name = "dynasty-maker"
version = "0.1.0"
description = "Local-first fantasy hockey GM assistant for one ESPN league."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "typer>=0.29.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
dynasty = "dynasty.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dynasty"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: needs a local Ollama server; not run on GitHub-hosted runners",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
